service:
  name: aac-nextcloud
  friendly_name: Cloud
  image_repo: nextcloud
  image_tag: 34
  description: Selfhosted Cloud Plattform
  icon: nextcloud.png
  category: Finanzen - Dokumente - Organisation
  stage: prod
  hostname: cloud
ports:
- name: web
  port: 80
  external_port: 29765
  protocol: TCP
- name: web
  port: 443
  external_port: 29763
  protocol: TCP
config:
  domain_name: example.com
  generate_hostname: false
  integrations:
    homepage:
      enabled: true
    autodns:
      enabled: true
    traefik:
      enabled: true
      internet_facing: true
      cert_resolver: ionos
      entrypoint: websecure
  schema_version: 2
stage_overrides:
  prod:
    config:
      generate_hostname: false
      public_domain_name: example.com
      integrations:
        traefik:
          enabled: true
          internet_facing: true
          cert_resolver: ionos
          entrypoint: websecure
          ervice_port: 80
    service:
      hostname: cloud
secrets:
  NEXTCLOUD_ADMIN_PASSWORD: CHANGE_ME
  MYSQL_PASSWORD: CHANGE_ME
  NEXTCLOUD_ADMIN_USER: admin
  MARIADB_DATABASE: nextcloud
  MARIADB_USER: nextcloud
  MARIADB_PASSWORD: CHANGE_ME
  MARIADB_ROOT_PASSWORD: CHANGE_ME
  HOMEPAGE_WIDGET_USERNAME: admin
  HOMEPAGE_WIDGET_PASSWORD: CHANGE_ME
  MARIADB_ALLOW_EMPTY_PASSWORD: CHANGE_ME
  MARIADB_RANDOM_ROOT_PASSWORD: CHANGE_ME
volumes:
  html:
    description: Nextcloud application and web root
    uid: '33'
    gid: '33'
  db:
    description: Data for database
  redis-data:
    description: Data for redis
  galaxy_01:
    type: bind
    source: /mnt/nextcloud
deployment_strategy:
  main:
    enabled: true
    target_stage: prod
  dev:
    enabled: true
    target_stage: dev
  test:
    enabled: false
    target_stage: test
  ansible-dev:
    enabled: true
    target_stage: dev
  iac-dev:
    enabled: true
    target_stage: dev
  template-dev:
    enabled: true
    target_stage: dev
deployments:
  docker_compose:
    restart_policy: always
    host_base_path: /export/docker
    volumes:
    - html:/var/www/html
    - galaxy_01:/mnt/data
    environment:
      NEXTCLOUD_ADMIN_USER: '{{ secrets.NEXTCLOUD_ADMIN_USER }}'
      NEXTCLOUD_ADMIN_PASSWORD: '{{ secrets.NEXTCLOUD_ADMIN_PASSWORD }}'
      MYSQL_HOST: '{{ vars.MYSQL_HOST }}'
      MYSQL_DATABASE: '{{ vars.MYSQL_DATABASE }}'
      MYSQL_USER: '{{ vars.MYSQL_USER }}'
      MYSQL_PASSWORD: '{{ secrets.MYSQL_PASSWORD }}'
      REDIS_HOST: '{{ vars.REDIS_HOST }}'
      REDIS_HOST_PORT: '{{ vars.REDIS_HOST_PORT }}'
      SERVICE_IMAGE_TAG: '{{ vars.SERVICE_IMAGE_TAG }}'
      OVERWRITECLIURL: '{{ vars.OVERWRITECLIURL }}'
      OVERWRITEPROTOCOL: '{{ vars.OVERWRITEPROTOCOL }}'
      OVERWRITEHOST: '{{ vars.OVERWRITEHOST }}'
      TRUSTED_PROXIES: '{{ vars.TRUSTED_PROXIES }}'
      NEXTCLOUD_TRUSTED_DOMAINS: '{{ vars.NEXTCLOUD_TRUSTED_DOMAINS }}'
      NEXTCLOUD_DATA_DIR: '{{ vars.NEXTCLOUD_DATA_DIR }}'
      TZ: '{{ vars.TZ }}'
      NEXTCLOUD_INIT_HTACCESS: '{{ vars.NEXTCLOUD_INIT_HTACCESS }}'
      NEXTCLOUD_INIT_LOCK: '{{ vars.NEXTCLOUD_INIT_LOCK }}'
      APACHE_DISABLE_REWRITE_IP: '{{ vars.APACHE_DISABLE_REWRITE_IP }}'
      NEXTCLOUD_UPDATE: '{{ vars.NEXTCLOUD_UPDATE }}'
      PHP_MEMORY_LIMIT: '{{ vars.PHP_MEMORY_LIMIT }}'
      PHP_UPLOAD_LIMIT: '{{ vars.PHP_UPLOAD_LIMIT }}'
      NEXTCLOUD_UPLOAD_MAX_FILESIZE: '{{ vars.NEXTCLOUD_UPLOAD_MAX_FILESIZE }}'
      NEXTCLOUD_MAX_FILE_UPLOADS: '{{ vars.NEXTCLOUD_MAX_FILE_UPLOADS }}'
      MARIADB_DATABASE: '{{ secrets.MARIADB_DATABASE }}'
      MARIADB_USER: '{{ secrets.MARIADB_USER }}'
      MARIADB_PASSWORD: '{{ secrets.MARIADB_PASSWORD }}'
      MARIADB_ROOT_PASSWORD: '{{ secrets.MARIADB_ROOT_PASSWORD }}'
      HOMEPAGE_WIDGET_USERNAME: '{{ secrets.HOMEPAGE_WIDGET_USERNAME }}'
      HOMEPAGE_WIDGET_PASSWORD: '{{ secrets.HOMEPAGE_WIDGET_PASSWORD }}'
      MARIADB_ALLOW_EMPTY_PASSWORD: '{{ secrets.MARIADB_ALLOW_EMPTY_PASSWORD }}'
      MARIADB_RANDOM_ROOT_PASSWORD: '{{ secrets.MARIADB_RANDOM_ROOT_PASSWORD }}'
dependencies:
  database:
    import: catalog/mariadb.yml
    overrides:
      name: aac-nextcloud-db
      image_tag: 12.3.1-ubi10-rc
      volumes:
        db:
          target: /var/lib/mysql
          description: Persistent storage for db
      environment:
        TZ: '{{ vars.TZ }}'
  redis:
    import: catalog/redis.yml
    overrides:
      name: aac-nextcloud-redis
      image_tag: 8.6.1
      volumes:
        redis-data:
          target: /data
          description: Persistent storage for redis-data
      environment:
        TZ: '{{ vars.TZ }}'
vars:
  NEXTCLOUD_ADMIN_USER: '{{ secrets.NEXTCLOUD_ADMIN_USER }}'
  MYSQL_HOST: cloud.example.com
  MYSQL_DATABASE: '{{ secrets.MARIADB_DATABASE }}'
  MYSQL_USER: '{{ secrets.MARIADB_USER }}'
  REDIS_HOST: cloud.example.com
  REDIS_HOST_PORT: '6379'
  SERVICE_IMAGE_TAG: 34
  OVERWRITECLIURL: https://cloud.example.com
  OVERWRITEPROTOCOL: https
  OVERWRITEHOST: cloud.example.com
  TRUSTED_PROXIES: CHANGE_ME
  NEXTCLOUD_TRUSTED_DOMAINS: cloud.example.com
  NEXTCLOUD_DATA_DIR: /mnt/data
  TZ: Europe/Berlin
  NEXTCLOUD_INIT_HTACCESS: 'false'
  NEXTCLOUD_INIT_LOCK: 'false'
  APACHE_DISABLE_REWRITE_IP: '1'
  NEXTCLOUD_UPDATE: '0'
  PHP_MEMORY_LIMIT: 1G
  PHP_UPLOAD_LIMIT: 100G
  NEXTCLOUD_UPLOAD_MAX_FILESIZE: 100G
  NEXTCLOUD_MAX_FILE_UPLOADS: '20000'
